name: Discord Alerts — ABAcaTEA

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Send Discord notification
    runs-on: ubuntu-latest

    steps:
      - name: Send alert to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not configured."
            exit 1
          fi

          MESSAGE=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg actor "$ACTOR" \
            '{
              content: ("📢 **ABAcaTEA — Atualização no GitHub**\n\n" +
                "📦 Repositório: " + $repo + "\n" +
                "🌿 Branch: " + $branch + "\n" +
                "👤 Autor: " + $actor + "\n" +
                "📝 Commit: " + $commit + "\n" +
                "🔗 " + $url)
            }')

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "$MESSAGE" \
            "$DISCORD_WEBHOOK"